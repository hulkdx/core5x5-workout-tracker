name: Deploy to Google Play

on:
  push:
    branches: [ main ]

env:
  JAVA_VERSION: 21
  JAVA_DIST: "zulu"

jobs:
  Deploy-To-Google-Play:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: ${{ env.JAVA_DIST }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Version bump setup
        run: echo "RELEASE_DATE=$(date -u +%Y.%m.%d)" >> "$GITHUB_ENV"

      - name: Version bump
        uses: chkfung/android-version-actions@v1.2.3
        with:
          gradlePath: androidApp/build.gradle.kts
          versionCode: ${{ github.run_number }}
          versionName: ${{ env.RELEASE_DATE }}

      - name: Build release bundle
        run: ./gradlew bundleRelease

      - name: Sign release bundle
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: androidApp/build/outputs/bundle/release
          signingKeyBase64: ${{ secrets.KEYSTORE }}
          alias: ${{ secrets.KEYSTORE_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEYSTORE_PASSWORD }}

      - name: Store release bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: artifacts
          path: |
            androidApp/build/outputs/bundle/release/androidApp-release.aab

