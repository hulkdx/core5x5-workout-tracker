name: Deploy to Google Play

on:
  push:
    branches: [ main ]

# Keep only the newest run for this Play package, including build and publishing.
concurrency:
  group: google-play-com.hulkdx.core5x5
  cancel-in-progress: true

env:
  JAVA_VERSION: 21
  JAVA_DIST: "zulu"

jobs:
  Deploy-To-Google-Play:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: ${{ env.JAVA_DIST }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Version bump setup
        run: |
          echo "RELEASE_DATE=$(date -u +%Y.%m.%d)" >> "$GITHUB_ENV"
          # The previous push.yml workflow reached run 36. Renaming it resets the run counter.
          echo "VERSION_CODE=$((36 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Version bump
        uses: chkfung/android-version-actions@v1.2.3
        with:
          gradlePath: androidApp/build.gradle.kts
          versionCode: ${{ env.VERSION_CODE }}
          versionName: ${{ env.RELEASE_DATE }}

      - name: Build release bundle
        run: ./gradlew bundleRelease

      - name: Sign release bundle
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: androidApp/build/outputs/bundle/release
          signingKeyBase64: ${{ secrets.KEYSTORE }}
          alias: ${{ secrets.KEYSTORE_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEYSTORE_PASSWORD }}

#      - name: Store release bundle artifact
#        uses: actions/upload-artifact@v7
#        with:
#          name: artifacts
#          path: |
#            androidApp/build/outputs/bundle/release/androidApp-release.aab

      - name: Setup authorization with GooglePlay Store
        run: echo '${{ secrets.GOOGLE_SERVICES_API }}' | base64 --decode > service_account.json

      - name: Deploy
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJson: service_account.json
          packageName: com.hulkdx.core5x5
          releaseFiles: androidApp/build/outputs/bundle/release/androidApp-release.aab
          tracks: internal
          whatsNewDirectory: .github/whatsNewDirectory
